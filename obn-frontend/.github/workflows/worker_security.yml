name: Dependency security

on:
  pull_request:
    paths:
      - 'scripts/autoclaim/**'
      - 'scripts/analytics/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/*.test.*'
      - 'src/**'
  push:
    branches: [main]
    paths:
      - 'scripts/autoclaim/**'
      - 'scripts/analytics/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/*.test.*'
      - 'src/**'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISABLE_CDP_ERROR_REPORTING: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      # Match the lockfile authoring/validation toolchain. npm 10 applies
      # version-scoped overrides differently and rejects this valid npm 11 lock.
      - run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - run: npm run test:security
      - run: npm audit --omit=dev --audit-level=moderate
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        worker: [autoclaim, analytics]
    defaults:
      run:
        working-directory: scripts/${{ matrix.worker }}
    env:
      DISABLE_CDP_ERROR_REPORTING: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/${{ matrix.worker }}/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm audit --omit=dev --audit-level=moderate
