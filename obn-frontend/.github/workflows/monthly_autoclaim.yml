name: OBN Monthly Autoclaim

on:
  schedule:
    - cron: '23 9-23 14 * *'
  workflow_dispatch:
    inputs:
      send:
        description: Submit claims only if AUTOCLAIM_ENABLED is true (otherwise read-only checks)
        type: boolean
        default: false
      bootstrap:
        description: Initialize missing journal only after confirming no unresolved prior submissions
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: obn-monthly-autoclaim-base
  cancel-in-progress: false

defaults:
  run:
    working-directory: scripts/autoclaim

env:
  DISABLE_CDP_ERROR_REPORTING: 'true'

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.AUTOCLAIM_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/autoclaim/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Worker regression tests
        run: npm test
      - name: Read-only mainnet readiness check
        run: npm run check
        env:
          AUTOCLAIM_ENABLED: ${{ vars.AUTOCLAIM_ENABLED }}
          AUTOCLAIM_RPC_URL: ${{ secrets.AUTOCLAIM_RPC_URL }}
          AUTOCLAIM_PAYMASTER_URL: ${{ secrets.AUTOCLAIM_PAYMASTER_URL }}
          AUTOCLAIM_CDP_API_KEY_ID: ${{ secrets.AUTOCLAIM_CDP_API_KEY_ID }}
          AUTOCLAIM_CDP_API_KEY_SECRET: ${{ secrets.AUTOCLAIM_CDP_API_KEY_SECRET }}
          AUTOCLAIM_CDP_WALLET_SECRET: ${{ secrets.AUTOCLAIM_CDP_WALLET_SECRET }}
          AUTOCLAIM_OWNER: ${{ vars.AUTOCLAIM_OWNER }}
          AUTOCLAIM_EXECUTOR: ${{ vars.AUTOCLAIM_EXECUTOR }}
          AUTOCLAIM_START_BLOCK: ${{ vars.AUTOCLAIM_START_BLOCK }}
  claim:
    needs: validate
    if: vars.AUTOCLAIM_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/autoclaim/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Select latest durable journal
        id: journal
        run: node recover-journal.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOCLAIM_SEND: ${{ github.event_name == 'schedule' || inputs.send }}
          AUTOCLAIM_BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap }}
      - name: Restore selected journal
        if: steps.journal.outputs.artifact-id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: scripts/autoclaim/.autoclaim
          artifact-ids: ${{ steps.journal.outputs.artifact-id }}
          run-id: ${{ steps.journal.outputs.run-id }}
          github-token: ${{ github.token }}
          merge-multiple: true
      - name: Simulate claims
        if: github.event_name == 'workflow_dispatch' && !inputs.send
        run: npm start
        env:
          AUTOCLAIM_SEND: 'false'
          AUTOCLAIM_RPC_URL: ${{ secrets.AUTOCLAIM_RPC_URL }}
          AUTOCLAIM_EXECUTOR: ${{ vars.AUTOCLAIM_EXECUTOR }}
          AUTOCLAIM_START_BLOCK: ${{ vars.AUTOCLAIM_START_BLOCK }}
          AUTOCLAIM_MAX_CLAIMS: '300'
      - name: Reconcile and claim
        id: worker
        if: github.event_name == 'schedule' || inputs.send
        run: npm start
        env:
          AUTOCLAIM_SEND: 'true'
          AUTOCLAIM_BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap }}
          AUTOCLAIM_RPC_URL: ${{ secrets.AUTOCLAIM_RPC_URL }}
          AUTOCLAIM_PAYMASTER_URL: ${{ secrets.AUTOCLAIM_PAYMASTER_URL }}
          AUTOCLAIM_CDP_API_KEY_ID: ${{ secrets.AUTOCLAIM_CDP_API_KEY_ID }}
          AUTOCLAIM_CDP_API_KEY_SECRET: ${{ secrets.AUTOCLAIM_CDP_API_KEY_SECRET }}
          AUTOCLAIM_CDP_WALLET_SECRET: ${{ secrets.AUTOCLAIM_CDP_WALLET_SECRET }}
          AUTOCLAIM_OWNER: ${{ vars.AUTOCLAIM_OWNER }}
          AUTOCLAIM_EXECUTOR: ${{ vars.AUTOCLAIM_EXECUTOR }}
          AUTOCLAIM_START_BLOCK: ${{ vars.AUTOCLAIM_START_BLOCK }}
          AUTOCLAIM_MAX_CLAIMS: '300'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && hashFiles('scripts/autoclaim/.autoclaim/state.json') != ''
        with:
          name: autoclaim-journal-${{ github.run_id }}-${{ github.run_attempt }}
          path: scripts/autoclaim/.autoclaim/state.json
          include-hidden-files: true
          retention-days: 90
